name: Release packages

# Builds every package in Docker when a version tag (v0.1.0, ...) is pushed and attaches
# them to a draft GitHub release. Can also be started by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, debian-12, debian-13,
                 fedora-43, opensuse-tumbleweed, appimage]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.target }}
        run: packaging/build-all.sh ${{ matrix.target }}
      - name: Rename for the release
        run: |
          mkdir -p out
          for f in dist/${{ matrix.target }}/*; do
            case "${{ matrix.target }}" in
              appimage) cp "$f" out/ ;;
              *) cp "$f" "out/${{ matrix.target }}_$(basename "$f")" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
